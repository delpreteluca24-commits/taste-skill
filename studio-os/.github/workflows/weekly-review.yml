# Opens one weekly review issue (template). Cannot spend money, generate or publish.
name: weekly-review
on:
  schedule: [{cron: "0 7 * * 1"}]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Emergency stop check
        run: |
          if grep -Eq '^EMERGENCY_STOP:\s*true' 08_AUTOMATION/configs/autonomy.yml; then echo "STOP=1" >> "$GITHUB_ENV"; fi
      - name: Summarize costs
        if: env.STOP != '1'
        run: |
          pip install -q pyyaml
          python3 - <<'PY' >> "$GITHUB_ENV"
          import csv, yaml
          cfg = yaml.safe_load(open('08_AUTOMATION/configs/autonomy.yml'))['budget']
          ceiling = cfg['capital_eur'] * (1 - cfg['reserve_pct'] / 100)
          rows = list(csv.DictReader(open('06_ANALYTICS/production-costs/cost-log.csv')))
          spent = sum(float(r['eur'] or 0) for r in rows)
          print(f"SPENT={spent:.2f}"); print(f"CEILING={ceiling:.2f}"); print(f"REMAINING={ceiling - spent:.2f}")
          PY
      - name: Open weekly review issue
        if: env.STOP != '1'
        uses: actions/github-script@v7
        with:
          script: |
            const d = new Date().toISOString().slice(0,10);
            const title = `Weekly Business Review ${d}`;
            const existing = await github.rest.search.issuesAndPullRequests({q: `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${title}"`});
            if (existing.data.total_count) return;
            const s = ['WHAT WE BUILT','WHAT WE LEARNED','WHAT FAILED','WHAT COST MONEY','WHAT CREATED REUSABLE ASSETS','WHAT PERFORMED','WHAT DID NOT','WHAT CHANGED','TOP RISKS','NEXT EXPERIMENT','BUDGET REMAINING','FOUNDER DECISIONS'];
            const body = `Spent to date: €${process.env.SPENT} · Spendable remaining (ceiling €${process.env.CEILING}): €${process.env.REMAINING}\n\n` + s.map(x => `## ${x}\n_TBD by CEO agent_`).join('\n\n');
            await github.rest.issues.create({...context.repo, title, body, labels: ['agent:ceo','status:ready','priority:p1']});
