[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Local, free long-to-short video clipper: transcribe, pick viral moments with an LLM, render 9:16 clips with animated captions."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
  "faster-whisper>=1.1",
  "yt-dlp>=2025.1.1",
  "pydantic>=2.6",
  "pyyaml>=6",
  "typer>=0.12",
  "rich>=13",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "imageio-ffmpeg>=0.5"]

[project.scripts]
clipforge = "clipforge.cli:app"

[tool.setuptools.packages.find]
include = ["clipforge*"]

[tool.setuptools.package-data]
clipforge = ["assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ffmpeg: needs a working ffmpeg binary"]
