# Copy to config.yaml and edit. Every CLI flag overrides these values.

lang: null                 # source language (it, en, ...). null = autodetect
mode: face                 # face (MediaPipe tracking) | sports (motion tracking) | center (static)
translate: null            # e.g. en -> also renders clip_XX.en.mp4 with translated captions
output_dir: output
# cache_dir: ~/.cache/clipforge   # downloads, audio, transcripts, SQLite state
ffmpeg_path: null          # set if ffmpeg is not on PATH
max_download_height: 1080

whisper:
  model: auto              # auto = large-v3-turbo on GPU, small on CPU
  device: auto             # auto | cpu | cuda
  compute_type: auto       # auto = float16 on GPU, int8 on CPU
  beam_size: 5
  vad: true

llm:
  provider: ollama:qwen2.5:7b   # gemini:gemini-2.5-flash (GEMINI_API_KEY) | groq:llama-3.3-70b-versatile (GROQ_API_KEY)
  ollama_host: http://localhost:11434
  temperature: 0.3
  timeout_s: 600
  max_retries: 2
  num_ctx: 16384
  window_s: 480            # transcript seconds per LLM call
  overlap_s: 60

clips:
  count: 10
  min_s: 20
  max_s: 60

captions:
  style: karaoke           # karaoke | simple | none
  font: Montserrat ExtraBold
  font_size: 84
  max_words: 3
  uppercase: true
  text_color: '#FFFFFF'
  highlight_color: '#FFE600'
  outline: 6
  margin_v: 560            # px from bottom (keeps captions above TikTok/Reels UI)
  hook: true
  hook_duration_s: 3.0
  hook_margin_v: 280       # px from top
  cta_text: null           # e.g. "Seguimi per la parte 2"
  cta_duration_s: 2.0

render:
  width: 1080
  height: 1920
  crf: 20
  preset: medium           # faster = quicker, bigger files
  audio_bitrate: 128k
  lufs: -14.0
  true_peak: -1.5
  lra: 11.0

reframe:
  analysis_fps: 5          # frames analysed per second
  analysis_width: 640
  min_face_conf: 0.5
  speakers: auto           # 2 people far apart: auto/switch = cut to who talks, split = stacked, single = biggest face
  min_shot_s: 1.5          # min time on a speaker before cutting
  deadzone: 0.08           # subject can move 8% of crop width before the camera follows
  max_speed: 0.5           # max pan speed, fraction of source width per second

gameplay:
  path: null               # video file or folder; enables 60/40 split (bottom muted, looped)
  top_ratio: 0.6

watch:
  interval_min: 15
  max_attempts: 3          # retries per video (live/premiere not ready yet...)

publish:
  client_secret: client_secret.json   # OAuth "Desktop app" client, YouTube Data API v3 enabled
  privacy: private         # unverified API projects can only publish private videos
  category_id: "22"
  daily_quota: 10000
  upload_cost: 1600
